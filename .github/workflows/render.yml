name: Render Video

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Render mode'
        required: true
        default: 'video'
        type: choice
        options:
          - video
          - frames

permissions:
  contents: read

jobs:
  render:
    name: Render to MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      - name: Start dev server
        run: |
          npm run dev &
          sleep 10
          curl -f http://localhost:5173 || exit 1

      - name: Render video
        run: node scripts/render.ts video
        env:
          DISPLAY: ':99'

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-video
          path: output.mp4
          retention-days: 90

      - name: Upload frames (optional)
        if: github.event.inputs.mode == 'frames'
        uses: actions/upload-artifact@v4
        with:
          name: output-frames
          path: frames/
          retention-days: 7